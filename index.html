<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>火柴人幸存者</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%;
        height: 100%; height: 100dvh;
        overflow: hidden; background: #f4f1e8;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      body { position: fixed; inset: 0; }
      #game {
        width: 100%; height: 100%; height: 100dvh;
        margin: 0; padding: 0; overflow: hidden;
      }
      canvas { touch-action: none; display: block; }
      #game canvas { margin: 0 !important; }
      /* 手机竖握时提示横屏（只对粗指针设备；桌面窄窗口不显示） */
      #rotate-hint {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1d1f2b; color: #ffffff;
        font: bold 22px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        align-items: center; justify-content: center; flex-direction: column; text-align: center;
      }
      #rotate-hint .icon { font-size: 56px; display: inline-block; transform: rotate(90deg); }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint"><span class="icon">📱</span><div>请横屏游玩</div></div>
    <script>
      // 阻止 iOS 双指缩放 / 双击缩放 / 下拉刷新（canvas 外的区域）
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd < 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
