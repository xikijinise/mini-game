<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 默认 = 电脑（与 main 一致）；判成手机时下方脚本把 viewport 换成手机版并补手机 meta -->
    <meta id="vp" name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>火柴人幸存者</title>
    <script>
      // 设备判定（尽早跑，决定外框样式/元信息/手势拦截；layout.js 读 window.__MG_DEVICE__，规则唯一来源在此）
      // 默认电脑。仅以下走手机：?device=mobile 强制；明确移动 UA（含 iPadOS 伪装 Mac+多触点）；
      // 主指针 coarse 且没有任何 fine 指针。?device=desktop 强制电脑。
      (function () {
        var d = 'desktop';
        try {
          var q = new URLSearchParams(location.search).get('device');
          var ua = navigator.userAgent || '';
          var uaMobile = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle|BlackBerry|Opera Mini|IEMobile|HarmonyOS/i.test(ua)
            || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
          var mm = function (s) { return !!(window.matchMedia && window.matchMedia(s).matches); };
          var coarseOnly = mm('(pointer: coarse)') && !mm('(any-pointer: fine)');
          if (q === 'mobile' || q === 'phone') d = 'mobile';
          else if (q === 'desktop' || q === 'pc') d = 'desktop';
          else if (uaMobile || coarseOnly) d = 'mobile';
        } catch (e) { d = 'desktop'; }
        window.__MG_DEVICE__ = d;
        document.documentElement.setAttribute('data-device', d);
        if (d !== 'mobile') return;
        document.getElementById('vp').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover');
        [['theme-color', '#f4f1e8'], ['apple-mobile-web-app-capable', 'yes'], ['mobile-web-app-capable', 'yes'],
         ['apple-mobile-web-app-status-bar-style', 'black-translucent'], ['format-detection', 'telephone=no']].forEach(function (p) {
          var m = document.createElement('meta'); m.name = p[0]; m.content = p[1]; document.head.appendChild(m);
        });
      })();
    </script>
    <style>
      /* 电脑（默认，同 main）：深色留边 #1d1f2b，1024×640 画布 FIT 居中 */
      html, body { margin: 0; height: 100%; background: #1d1f2b; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

      /* 手机：浅底铺满 + 禁缩放/选择/下拉，旋转自适应 */
      html[data-device="mobile"], html[data-device="mobile"] body {
        padding: 0; width: 100%;
        height: 100%; height: 100dvh;
        overflow: hidden; background: #f4f1e8;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      html[data-device="mobile"] body { position: fixed; inset: 0; }
      html[data-device="mobile"] #game {
        display: block; height: 100dvh;
        margin: 0; padding: 0; overflow: hidden;
      }
      html[data-device="mobile"] canvas { touch-action: none; display: block; }
      html[data-device="mobile"] #game canvas { margin: 0 !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // 仅手机：阻止 iOS 双指缩放 / 双击缩放 / 下拉刷新 / 长按菜单。电脑不拦截任何手势与右键。
      if (window.__MG_DEVICE__ === 'mobile') {
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
          document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - lastTouchEnd < 300) e.preventDefault();
          lastTouchEnd = now;
        }, { passive: false });
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
